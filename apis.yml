aid: uon
name: University of Newcastle Australia
x-type: university
x-category: Public Research University
description: >-
  The University of Newcastle (UON) is a public research university in Callaghan and Newcastle, New
  South Wales, ranked #179 in the QS World University Rankings order used by this cohort. It is a
  federation of buyers rather than an API producer: there is no central developer portal and no
  institutional API gateway — api.newcastle.edu.au, apis.newcastle.edu.au, developer.newcastle.edu.au,
  data.newcastle.edu.au and status.newcastle.edu.au all fail to resolve — and UON publishes no OpenAPI
  description for anything. What it genuinely operates is small and specific: a Shibboleth identity
  provider at idp.newcastle.edu.au serving live SAML 2.0 metadata under its own entityID and scope,
  registered in the Australian Access Federation; and a self-hosted XNAT 1.9.1.1 imaging-informatics
  platform at xnat.newcastle.edu.au, run with the Hunter Medical Research Institute on the
  university's own AWS estate, whose REST API answers on UON's host and is registered as a SAML
  service provider in the same federation. UON also holds two DataCite repository clients in its own
  name, ARDCX.UON and UONAU.FIGSHARE. Everything else that looks programmable is a tenancy on someone
  else's platform and is recorded as such, never as UON engineering: Open Research Newcastle is a
  Figshare tenancy, the course handbook is a CourseLoop tenancy, the learning management system is an
  Instructure Canvas tenancy, library guides are Springshare, site search is Squiz Funnelback, the
  student portal is PeopleSoft behind Okta, and the service desk is Oracle B2C Service. This profile
  was corrected on 2026-08-30: ten OpenAPI documents previously held here were Figshare's generic
  api.figshare.com/v2 contract, not the university's, and were removed along with everything derived
  from them.
