x-coverage:
  state: covered
  reason: covered
  detail: >-
    Two institution-operated surfaces and four tenant relationships were settled by live probe on
    2026-08-30, with the operator axis decided before anything was saved. The finding that matters is
    a correction: every OpenAPI in this repository was Figshare's. Ten refined specs plus the
    pre-refine original all carried info.title "Figshare Altmetric API" / "Figshare altmetric …",
    info.contact "Figshare Support" at support.figshare.com, and servers[0].url
    https://api.figshare.com/v2 — a generic vendor host the cohort audit shows claimed by sixteen
    other institutions. Those eleven documents and the thirty-six artifacts derived from them
    (collections, Postman collections, JSON Schema, JSON Structure, examples, JSON-LD context,
    Spectral rulesets, vocabulary, OAuth scopes, authentication summary, agentic-access contract,
    capability map) were removed. Nothing was derived to replace them, because UON publishes no
    machine-readable contract of its own: the XNAT deployment's Swagger at /xapi/v2/api-docs returns
    302 to login, and XNAT's contract belongs to the XNAT product in any case. What survived probing
    is real but modest — a live SAML 2.0 IdP metadata document, a live but almost entirely
    authentication-gated XNAT REST API, and a 9,755-URL handbook sitemap on a CourseLoop tenancy.
    Two limitations on us rather than findings about the institution: www.newcastle.edu.au and its
    subordinate hosts sit behind a Cloudflare bot challenge (HTTP 403, cf-mitigated: challenge), so
    robots.txt, llms.txt and .well-known could not be read there; and openresearch.newcastle.edu.au
    sits behind an AWS WAF challenge (HTTP 202, x-amzn-waf-action: challenge, zero-byte body) on
    every User-Agent tried, so the OAI-PMH Identify response was never seen and OAI-PMH is recorded
    as not established rather than assumed. Absences confirmed by negative probe rather than
    inferred: no API gateway, no developer portal, no open-data portal, no status page, no OIDC
    discovery document on the IdP, and no security.txt or robots.txt on the XNAT host (both return
    the application HTML shell, a soft-404). nova.newcastle.edu.au, the university's former VITAL
    research repository, is a dangling CNAME to a deleted AWS load balancer and no longer resolves.
