apis:
  - aid: uon:identity-federation
    name: University of Newcastle Shibboleth Identity Provider (SAML 2.0 metadata)
    description: >-
      UON's institutional identity provider, publishing machine-readable SAML 2.0 metadata at a
      stable URL. entityID https://idp.newcastle.edu.au/idp/shibboleth, shibmd:Scope newcastle.edu.au,
      SingleSignOnService endpoints for the HTTP-POST and HTTP-Redirect bindings, and a signing
      KeyDescriptor whose X.509 certificate carries CN=idp.newcastle.edu.au. Registered in the
      Australian Access Federation aggregate under the display name "University of Newcastle" and
      interfederated internationally through eduGAIN. This is institution-operated by definition and
      is the most consequential machine-readable surface UON runs — and the class of surface that is
      almost never catalogued.
    humanURL: https://www.newcastle.edu.au/
    baseURL: https://idp.newcastle.edu.au/idp/shibboleth
    tags:
      - Identity Federation
      - SAML
      - Shibboleth
      - AAF
      - eduGAIN
      - Single Sign-On
    x-operator: institution
    x-operator-evidence: >-
      Metadata is served from a newcastle.edu.au host, self-asserts scope newcastle.edu.au, and its
      signing certificate is issued to CN=idp.newcastle.edu.au. Present in the AAF federation
      aggregate under UON's own entityID. The public hostname CNAMEs to AAF's managed
      idp-cname.aaf.edu.au CloudFront front end; the federation entity, scope and signing key remain
      the university's.
    x-developer-usable: false
    x-developer-note: >-
      An end-user login federation, not a developer authorization surface. There is no client
      registration path, no token endpoint and no consent screen an outside developer could integrate
      against. GET /.well-known/openid-configuration returns 404 — SAML only.
    properties:
      - type: Conformance
        url: conformance/uon-conformance.yml
      - type: Federation
        url: https://md.aaf.edu.au/aaf-metadata.xml
  - aid: uon:xnat-imaging
    name: University of Newcastle XNAT Imaging Informatics Platform
    description: >-
      A self-hosted XNAT 1.9.1.1 imaging-informatics platform operated by the university with the
      Hunter Medical Research Institute, running on UON's own AWS estate in ap-southeast-2 behind the
      prod-xnat-hmri-frontend load balancer and registered as a SAML service provider
      (https://xnat.newcastle.edu.au/xnat) in the Australian Access Federation. The REST API is live
      on UON's host: /xapi/siteConfig/buildInfo and /xapi/siteConfig/siteId answer unauthenticated
      with application/json, and /data/JSESSION issues a session token, while /data/projects,
      /xapi/siteConfig and the Swagger description at /xapi/v2/api-docs all redirect to login. This is
      genuine institution-operated research computing, and it is authentication-gated rather than
      absent. No specification is saved here: XNAT's API contract is the XNAT product's, shared by
      every deployment, and this repository records the deployment rather than the product.
    humanURL: https://xnat.newcastle.edu.au/
    baseURL: https://xnat.newcastle.edu.au
    tags:
      - Research Computing
      - Medical Imaging
      - XNAT
      - Neuroimaging
      - Research Data
    x-operator: institution
    x-operator-evidence: >-
      Host is under newcastle.edu.au and resolves to prod-xnat-hmri-frontend-1616443891
      .ap-southeast-2.elb.amazonaws.com, a load balancer in the university's own AWS account. XNAT is
      open-source software the institution self-hosts; there is no vendor tenancy host in the chain.
      The instance is a registered SP in the AAF federation under UON's domain.
    x-software: XNAT 1.9.1.1 (open source, Washington University)
    x-developer-usable: false
    x-developer-note: >-
      Effectively closed to outside developers. Two unauthenticated site-configuration endpoints are
      readable; every data endpoint and the API description itself require a session. Access is by
      institutional affiliation through the federation, not by self-serve signup.
    properties:
      - type: Website
        url: https://xnat.newcastle.edu.au/
      - type: Conformance
        url: conformance/uon-conformance.yml
  - aid: uon:open-research-figshare
    name: Open Research Newcastle (Figshare) — TENANT
    description: >-
      The university's open-access institutional repository and research-data store, running on the
      Figshare platform at openresearch.newcastle.edu.au. This is a genuine institutional fact and one
      of the few programmable research surfaces UON has, so the relationship is recorded — but it is
      recorded as a TENANCY, not as a UON API. The data, the DOIs and the collection policy are UON's;
      the contract, the API design and the OAI-PMH implementation are Figshare's. No Figshare
      specification is kept in this repository. Eleven were, until 2026-08-30, and their removal is the
      substance of this re-profile. Probed: the host answers but every request returns an AWS WAF
      challenge (HTTP 202, x-amzn-waf-action: challenge, zero-byte body), including
      /oai?verb=Identify, so no OAI-PMH conformance is claimed.
    humanURL: https://openresearch.newcastle.edu.au/
    baseURL: https://openresearch.newcastle.edu.au
    tags:
      - Research Repository
      - Open Access
      - Figshare
      - Tenant
      - Research Data
      - DataCite
    x-operator: tenant
    x-operator-evidence: >-
      openresearch.newcastle.edu.au resolves to Figshare's eu-west-1 estate (54.170.206.11,
      34.250.3.122, 34.255.49.145) behind an AWS WAF. The generic contract every Figshare customer
      shares is served from api.figshare.com/v2, a host the cohort audit finds claimed by sixteen
      other institutions in this catalog.
    x-vendor: Figshare
    properties:
      - type: Website
        url: https://openresearch.newcastle.edu.au/
      - type: Documentation
        url: https://docs.figshare.com/
  - aid: uon:course-handbook-courseloop
    name: University of Newcastle Course Handbook (CourseLoop) — TENANT
    description: >-
      The university's program and course handbook, served from handbook.newcastle.edu.au on the
      CourseLoop platform. Machine-readable to the extent that it publishes a sitemap index whose
      child enumerates 9,755 program and course URLs with last-modified dates, which is a real
      discovery surface — but the data plane behind it is api-ap-southeast-2.prod.courseloop.com under
      a uon-prod site identifier, a generic vendor host, so this is a tenancy. No CourseLoop
      specification is saved here. The site's robots.txt disallows all crawlers except Googlebot,
      Bingbot and Funnelback, which is worth recording as an agent-access fact about a course catalog
      universities are usually happy to have indexed.
    humanURL: https://handbook.newcastle.edu.au/
    baseURL: https://handbook.newcastle.edu.au
    tags:
      - Course Catalog
      - CourseLoop
      - Tenant
      - Curriculum
      - Sitemap
    x-operator: tenant
    x-operator-evidence: >-
      handbook.newcastle.edu.au CNAMEs to d3ulpnuzhfoca8.cloudfront.net; the application's own
      envConfig names API_DOMAIN api-ap-southeast-2.prod.courseloop.com and bootstrapConfig siteId
      uon-prod, a per-customer identifier on a shared vendor host.
    x-vendor: CourseLoop
    properties:
      - type: Website
        url: https://handbook.newcastle.edu.au/
      - type: Sitemap
        url: https://handbook.newcastle.edu.au/sitemap.xml
  - aid: uon:canvas-lms
    name: University of Newcastle Canvas LMS (Instructure) — TENANT
    description: >-
      UON's learning management system, an Instructure Canvas tenancy reachable both at
      canvas.newcastle.edu.au and at newcastle.instructure.com, which return the same page byte for
      byte. Canvas ships a well-documented REST API and it is live on this tenancy —
      /api/v1/accounts returns HTTP 401 application/json with "user authorisation required" — so the
      surface exists and is authentication-gated rather than absent. It is Instructure's contract and
      Instructure's engineering; recorded as a tenancy, and no Canvas specification is saved here.
      Any LTI 1.3 or Caliper conformance on this platform is the vendor's, not the university's.
    humanURL: https://canvas.newcastle.edu.au/
    baseURL: https://newcastle.instructure.com/api/v1
    tags:
      - Learning Management
      - Canvas
      - Instructure
      - Tenant
      - Teaching
    x-operator: tenant
    x-operator-evidence: >-
      canvas.newcastle.edu.au serves the identical 26,245-byte Canvas login page as
      newcastle.instructure.com, a per-customer subdomain on Instructure's shared platform. The API
      answers on the instructure.com host.
    x-vendor: Instructure Canvas
    properties:
      - type: Website
        url: https://canvas.newcastle.edu.au/
      - type: Documentation
        url: https://canvas.instructure.com/doc/api/
