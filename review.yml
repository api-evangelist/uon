  - date: '2026-08-30'
    rating: 2
    summary: >-
      Re-profiled under the university pipeline, which settles operator attribution before saving
      anything. The June 2026 review credited "the documented public Figshare REST API" as UON's
      programmatic footprint, and the repository held eleven Figshare OpenAPI documents under UON's
      slug. That is a vendor's contract on a generic vendor host (api.figshare.com/v2, claimed by
      sixteen other institutions in this catalog) and it has been removed along with everything
      derived from it. Two institution-operated surfaces were verified in its place: a live Shibboleth
      SAML 2.0 identity provider at idp.newcastle.edu.au, registered in the Australian Access
      Federation, and a self-hosted XNAT 1.9.1.1 imaging platform at xnat.newcastle.edu.au on UON's
      own AWS estate, whose REST API is live but almost entirely authentication-gated. Four tenant
      relationships are recorded as tenancies rather than as UON APIs: Figshare, CourseLoop,
      Instructure Canvas and Springshare. UON holds two DataCite repository clients in its own name.
      The rating does not move: the footprint is genuinely thin, but it is now thin for the right
      reasons and attributed to the right operators.
