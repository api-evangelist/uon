specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: University of Newcastle Australia
providerId: uon
created: '2026-06-03'
modified: '2026-08-30'
reconciled: false
tags:
- Education
- Higher Education
- University
- Rate Limiting
description: >-
  University of Newcastle Australia publishes no rate-limit table, because it publishes no consumable
  public API. Corrected 2026-08-30: an earlier version of this file cited OAI-PMH, IIIF and library
  harvesting endpoints; none was verified as institution-operated. What throttling exists in practice
  is edge protection rather than a published policy — www.newcastle.edu.au sits behind a Cloudflare
  bot challenge (HTTP 403) and the Figshare-tenanted repository behind an AWS WAF challenge (HTTP 202),
  both of which reject automated clients outright rather than rate-limiting them.
notes: Confirm per-service limits with each API's documentation; harvest responsibly.
sources:
- https://raw.githubusercontent.com/api-evangelist/uon/refs/heads/main/apis.yml
responseCodes:
  throttled: 429
limits:
- name: Default
  scope: client
  metric: requests-per-minute
  limit: see service documentation
  notes: No published global limit; large harvests may be rate-limited.
policies:
- name: Backoff Strategy
  description: Exponential backoff with jitter; honor Retry-After; harvest during off-peak hours.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
